          )
          
          /**
           * Coordinates: local deterministic scoring (grammar/vocab/reading/listening)
           * + AI scoring (writing/speaking) + persistence.
           */
          class PlacementRepository(
              private val db: AppDatabase,
              private val ai: AnthropicClient = AnthropicClient()
          ) {
              private val json = Json { ignoreUnknownKeys = true }
          
              suspend fun recordAnswer(answer: PlacementAnswer) {
                  db.placementDao().insertAnswer(answer)
              }
          
              /** Sends a free-text Writing or Speaking-transcript sample to Claude for CEFR scoring. */
              suspend fun scoreWithAi(skill: String, targetLevelHint: CefrLevel, userText: String): AiSkillScore {
                  val system = """
                      You are a CEFR-aligned English examiner. Score the learner's $skill sample.
                      Base your judgment strictly on CEFR descriptors (A1, A2, B1, B2 only).
                      Respond ONLY with compact JSON, no prose, no markdown fences, in exactly this shape:
                      {"level":"A1|A2|B1|B2","summary":"one or two sentence explanation","mistakes":["short mistake 1","short mistake 2"]}
                  """.trimIndent()
          
                  val userPrompt = """
                      Learner's approximate level from other sections: ${targetLevelHint.name}
                      $skill sample:
                      "$userText"
                  """.trimIndent()
          
                  val raw = ai.complete(system, userPrompt)
                  val cleaned = raw.trim().removePrefix("```json").removePrefix("```").removeSuffix("```").trim()
                  return json.decodeFromString(AiSkillScore.serializer(), cleaned)
              }
          
              suspend fun saveProfile(profile: LearnerProfile) = db.placementDao().saveProfile(profile)
          
              suspend fun getProfile(): LearnerProfile? = db.placementDao().getProfile()
          
              suspend fun getAllAnswers(): List<PlacementAnswer> = db.placementDao().getAllAnswers()
          
              suspend fun resetPlacement() = db.placementDao().clearAnswers()
          }
          
