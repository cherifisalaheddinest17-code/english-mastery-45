                      ),
                      1
                  ),

                  McqQuestion(
                      "v_b2_1",
                      CefrLevel.B2,
                      "Their negotiation reached a stalemate. 'Stalemate' means:",
                      listOf(
                          "a quick agreement",
                          "a deadlock",
