          package com.englishmastery45.app.domain
          
          import com.englishmastery45.app.data.CefrLevel
          import com.englishmastery45.app.data.PlacementAnswer
          
          /**
           * Deterministic, rule-based CEFR mapping for Grammar/Vocabulary/Reading/Listening.
           * Kept rule-based (not AI-guessed) so the level estimate is explainable and consistent,
           * per the project requirement that CEFR scoring rest on clear descriptors, not free AI judgment.
           */
          object ScoringEngine {
          
              /**
               * Adaptive step logic used while the test is running: start at A2/B1,
               * move one level up on a correct answer, one level down on an incorrect one.
               */
              fun nextLevel(current: CefrLevel, wasCorrect: Boolean): CefrLevel {
                  val delta = if (wasCorrect) 1 else -1
                  val newOrder = (current.order + delta).coerceIn(0, CefrLevel.entries.size - 1)
                  return CefrLevel.entries[newOrder]
              }
          
              /** Given all answers for one skill, estimate the CEFR level for that skill. */
              fun estimateSkillLevel(answers: List<PlacementAnswer>): CefrLevel {
                  if (answers.isEmpty()) return CefrLevel.A1
                  // Weighted by difficulty: correct answers at a higher level count more.
                  val correctByLevel = answers
                      .filter { it.isCorrect == true }
                      .map { CefrLevel.valueOf(it.difficulty) }
          
                  val highest = correctByLevel.maxByOrNull { it.order } ?: CefrLevel.A1
          
                  // Require at least half of the questions at that level to be correct
                  // to avoid a single lucky guess inflating the estimate.
                  val atHighest = answers.filter { CefrLevel.valueOf(it.difficulty) == highest }
                  val correctAtHighest = atHighest.count { it.isCorrect == true }
                  return if (atHighest.isEmpty() || correctAtHighest * 2 >= atHighest.size) highest
                  else CefrLevel.entries[(highest.order - 1).coerceAtLeast(0)]
              }
          
              /** Simple overall level = rounded average of the six per-skill orders. */
              fun estimateOverallLevel(skillLevels: List<CefrLevel>): CefrLevel {
                  if (skillLevels.isEmpty()) return CefrLevel.A1
                  val avgOrder = skillLevels.map { it.order }.average()
                  return CefrLevel.entries[Math.round(avgOrder).toInt().coerceIn(0, CefrLevel.entries.size - 1)]
              }
          
              fun strengthsAndWeaknesses(skillScores: Map<String, CefrLevel>): Pair<List<String>, List<String>> {
                  val overallOrder = skillScores.values.map { it.order }.average()
                  val strengths = skillScores.filter { it.value.order > overallOrder }.keys.toList()
                  val weaknesses = skillScores.filter { it.value.order < overallOrder }.keys.toList()
                  return strengths to weaknesses
              }
          }
          
