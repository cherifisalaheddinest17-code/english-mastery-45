              val resultProfile: LearnerProfile? = null
          )
          
          class PlacementViewModel(app: Application) : AndroidViewModel(app) {
          
              private val repo = PlacementRepository(AppDatabase.getInstance(app))
          
              private val _state = MutableStateFlow(PlacementUiState())
              val state: StateFlow<PlacementUiState> = _state
          
              private val maxQuestionsPerSection = 3
          
              fun setName(name: String) {
                  _state.value = _state.value.copy(userName = name)
              }
          
              fun currentQuestion(): McqQuestion? {
                  val bank = bankFor(_state.value.section) ?: return null
                  return bank.firstOrNull { it.level == _state.value.currentLevel }
                      ?: bank.minByOrNull { kotlin.math.abs(it.level.order - _state.value.currentLevel.order) }
              }
          
              private fun bankFor(section: TestSection): List<McqQuestion>? = when (section) {
                  TestSection.GRAMMAR -> QuestionBank.grammar
                  TestSection.VOCABULARY -> QuestionBank.vocabulary
                  TestSection.READING -> QuestionBank.reading
                  TestSection.LISTENING -> QuestionBank.listening
                  else -> null
              }
          
              /** Called after the user answers an MCQ question in an adaptive (deterministic) section. */
              fun submitMcqAnswer(question: McqQuestion, chosenIndex: Int) {
                  val correct = chosenIndex == question.correctIndex
                  viewModelScope.launch {
                      repo.recordAnswer(
                          PlacementAnswer(
                              skill = _state.value.section.name.lowercase(),
                              questionId = question.id,
                              difficulty = question.level.name,
                              userResponse = chosenIndex.toString(),
                              isCorrect = correct
                          )
                      )
                  }
                  val nextLevel = ScoringEngine.nextLevel(_state.value.currentLevel, correct)
                  val nextIndex = _state.value.questionIndexInSection + 1
                  if (nextIndex >= maxQuestionsPerSection) {
                      advanceSection()
                  } else {
                      _state.value = _state.value.copy(currentLevel = nextLevel, questionIndexInSection = nextIndex)
                  }
              }
          
              /** Called for Writing/Speaking free-text (or transcript) submissions — scored by AI. */
              fun submitAiScoredAnswer(skill: TestSection, text: String) {
                  viewModelScope.launch {
                      _state.value = _state.value.copy(isAnalyzing = true, error = null)
                      try {
                          val score = repo.scoreWithAi(skill.name.lowercase(), _state.value.currentLevel, text)
                          repo.recordAnswer(
                              PlacementAnswer(
                                  skill = skill.name.lowercase(),
                                  questionId = "${skill.name.lowercase()}_free_text",
                                  difficulty = score.level,
                                  userResponse = text,
                                  isCorrect = null,
                                  aiScoreJson = score.summary
                              )
                          )
                          _state.value = _state.value.copy(isAnalyzing = false)
                          advanceSection()
                      } catch (e: Exception) {
                          val detail = e.message?.takeIf { it.isNotBlank() } ?: e.toString()
                          _state.value = _state.value.copy(isAnalyzing = false, error = "AI scoring failed: $detail")
                      }
                  }
              }
          
              private fun advanceSection() {
                  val order = listOf(
                      TestSection.GRAMMAR, TestSection.VOCABULARY, TestSection.READING,
                      TestSection.LISTENING, TestSection.WRITING, TestSection.SPEAKING, TestSection.DONE
                  )
                  val nextSection = order[order.indexOf(_state.value.section) + 1]
                  _state.value = _state.value.copy(
                      section = nextSection,
                      currentLevel = CefrLevel.A2,
                      questionIndexInSection = 0
                  )
                  if (nextSection == TestSection.DONE) finalizeProfile()
              }
          
              private fun finalizeProfile() {
                  viewModelScope.launch {
                      _state.value = _state.value.copy(isAnalyzing = true)
                      val answers = repo.getAllAnswers()
          
                      fun levelFor(skill: String): CefrLevel {
                          val skillAnswers = answers.filter { it.skill == skill }
                          return ScoringEngine.estimateSkillLevel(skillAnswers)
                      }
          
                      // Writing/Speaking already carry an AI-assigned level string in `difficulty`.
                      fun aiLevelFor(skill: String): CefrLevel =
                          answers.filter { it.skill == skill }
                              .mapNotNull { runCatching { CefrLevel.valueOf(it.difficulty) }.getOrNull() }
                              .firstOrNull() ?: CefrLevel.A2
          
                      val grammar = levelFor("grammar")
                      val vocabulary = levelFor("vocabulary")
                      val reading = levelFor("reading")
                      val listening = levelFor("listening")
                      val writing = aiLevelFor("writing")
                      val speaking = aiLevelFor("speaking")
          
                      val skillMap = mapOf(
                          "Grammar" to grammar, "Vocabulary" to vocabulary, "Reading" to reading,
                          "Listening" to listening, "Writing" to writing, "Speaking" to speaking
                      )
                      val overall = ScoringEngine.estimateOverallLevel(skillMap.values.toList())
                      val (strengths, weaknesses) = ScoringEngine.strengthsAndWeaknesses(skillMap)
          
                      val profile = LearnerProfile(
                          name = _state.value.userName.ifBlank { "Learner" },
                          overallLevel = overall.name,
                          grammarLevel = grammar.name,
                          vocabularyLevel = vocabulary.name,
                          readingLevel = reading.name,
                          listeningLevel = listening.name,
                          writingLevel = writing.name,
                          speakingLevel = speaking.name,
                          strengths = strengths.joinToString(","),
                          weaknesses = weaknesses.joinToString(","),
                          placementCompletedAt = System.currentTimeMillis()
                      )
                      repo.saveProfile(profile)
                      _state.value = _state.value.copy(isAnalyzing = false, resultProfile = profile)
                  }
              }
          }
          
