                          "to relax"
                      ),
                      0
                  ),

                  McqQuestion(
                      "v_b1_1",
                      CefrLevel.B1,
                      "He finally decided to give up smoking — 'give up' means:",
                      listOf(
                          "to start",
                          "to stop",
                          "to enjoy",
