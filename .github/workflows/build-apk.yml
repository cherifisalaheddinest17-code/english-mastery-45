          package com.englishmastery45.app.domain

          import com.englishmastery45.app.data.*

          import kotlinx.serialization.Serializable
          import kotlinx.serialization.json.Json

          @Serializable
          data class AiSkillScore(
              val level: String,
              val summary: String,
              val mistakes: List<String> =
                  emptyList()
          )

          class PlacementRepository(
              private val db: AppDatabase,
              private val ai: AnthropicClient =
                  AnthropicClient()
          ) {

              private val json = Json {
                  ignoreUnknownKeys = true
              }

              suspend fun recordAnswer(
                  answer: PlacementAnswer
              ) {
                  db.placementDao()
                      .insertAnswer(answer)
              }

              suspend fun scoreWithAi(
                  skill: String,
                  targetLevelHint: CefrLevel,
                  userText: String
              ): AiSkillScore {

                  val system = """
                      You are a CEFR-aligned English examiner.
                      Score the learner's $skill sample.

                      Base your judgment strictly on CEFR
                      descriptors (A1, A2, B1, B2 only).

                      Respond ONLY with compact JSON.

                      Exact shape:
                      {"level":"A1","summary":"one or two sentence explanation","mistakes":[]}
                  """.trimIndent()

                  val userPrompt = """
                      Learner approximate level:
                      ${targetLevelHint.name}

                      Skill:
                      $skill

                      Learner sample:
                      "$userText"
                  """.trimIndent()

                  val raw =
                      ai.complete(
                          system,
                          userPrompt
                      )

                  val cleaned =
                      raw.trim()
                          .removePrefix("```json")
                          .removePrefix("```")
                          .removeSuffix("```")
                          .trim()

                  return json.decodeFromString(
                      AiSkillScore.serializer(),
                      cleaned
                  )
              }

              suspend fun saveProfile(
                  profile: LearnerProfile
              ) {
                  db.placementDao()
                      .saveProfile(profile)
              }

              suspend fun getProfile():
                  LearnerProfile? =
                  db.placementDao()
                      .getProfile()

              suspend fun getAllAnswers():
                  List<PlacementAnswer> =
                  db.placementDao()
                      .getAllAnswers()

              suspend fun resetPlacement() {
                  db.placementDao()
                      .clearAnswers()
              }
          }
