          # ========================================================
          # MAIN ACTIVITY
          # ========================================================

          cat > app/src/main/java/com/englishmastery45/app/MainActivity.kt <<'EOF'
          package com.englishmastery45.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.viewModels
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Surface
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier

          import com.englishmastery45.app.data.QuestionBank
          import com.englishmastery45.app.ui.PlacementViewModel
          import com.englishmastery45.app.ui.TestSection
          import com.englishmastery45.app.ui.screens.*

          class MainActivity : ComponentActivity() {

              private val viewModel: PlacementViewModel
                  by viewModels()

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {
                  super.onCreate(savedInstanceState)

                  setContent {

                      MaterialTheme {

                          Surface(
                              modifier = Modifier.fillMaxSize()
                          ) {

                              AppRoot(viewModel)
                          }
                      }
                  }
              }
          }

          private enum class Screen {
              SPLASH,
              ONBOARDING,
              TEST,
              RESULTS
          }

          @Composable
          private fun AppRoot(
              viewModel: PlacementViewModel
          ) {

              var screen by remember {
                  mutableStateOf(Screen.SPLASH)
              }

              val state by viewModel.state.collectAsState()

              when (screen) {

                  Screen.SPLASH -> {

                      SplashScreen {

                          screen = Screen.ONBOARDING
                      }
                  }

                  Screen.ONBOARDING -> {

                      OnboardingScreen { name ->

                          viewModel.setName(name)

                          screen = Screen.TEST
                      }
                  }

                  Screen.TEST -> {

                      if (state.section == TestSection.DONE) {

                          screen = Screen.RESULTS

                      } else if (state.isAnalyzing) {

                          AnalyzingScreen()

                      } else {

                          when (state.section) {

                              TestSection.GRAMMAR,
                              TestSection.VOCABULARY,
                              TestSection.READING,
                              TestSection.LISTENING -> {

                                  val question =
                                      viewModel.currentQuestion()

                                  if (question != null) {

                                      McqQuestionScreen(
                                          sectionTitle =
                                              state.section.name,
                                          question = question,
                                          onAnswer = { index ->

                                              viewModel
                                                  .submitMcqAnswer(
                                                      question,
                                                      index
                                                  )
                                          }
                                      )
                                  }
                              }

                              TestSection.WRITING -> {

                                  val prompt =
                                      QuestionBank
                                          .writingPrompts[
                                              state.currentLevel
                                          ]
                                          ?: QuestionBank
                                              .writingPrompts
                                              .values
                                              .first()

                                  FreeTextScreen(
                                      sectionTitle = "WRITING",
                                      prompt = prompt,
                                      submitLabel =
                                          "Submit writing sample",
                                      isAnalyzing =
                                          state.isAnalyzing,
                                      error = state.error,
                                      onSubmit = { text ->

                                          viewModel
                                              .submitAiScoredAnswer(
                                                  TestSection.WRITING,
                                                  text
                                              )
                                      }
                                  )
                              }

                              TestSection.SPEAKING -> {

                                  val prompt =
                                      QuestionBank
                                          .speakingPrompts[
                                              state.currentLevel
                                          ]
                                          ?: QuestionBank
                                              .speakingPrompts
                                              .values
                                              .first()

                                  FreeTextScreen(
                                      sectionTitle =
                                          "SPEAKING",
                                      prompt = prompt,
                                      submitLabel =
                                          "Submit speaking sample",
                                      isAnalyzing =
                                          state.isAnalyzing,
                                      error = state.error,
                                      onSubmit = { text ->

                                          viewModel
                                              .submitAiScoredAnswer(
                                                  TestSection.SPEAKING,
                                                  text
                                              )
                                      }
                                  )
                              }

                              else -> {}
                          }
                      }
                  }

                  Screen.RESULTS -> {

                      ResultsScreen(
                          state = state,
                          onRestart = {

                              screen = Screen.ONBOARDING
                          }
                      )
                  }
              }
          }
          EOF

          # ========================================================
          # ANTHROPIC API
          # NETWORK IS ALWAYS IO
          # ========================================================

          cat > app/src/main/java/com/englishmastery45/app/data/AnthropicApi.kt <<'EOF'
          package com.englishmastery45.app.data

          import com.englishmastery45.app.BuildConfig

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext

          import kotlinx.serialization.SerialName
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.json.Json

          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody

          import java.util.concurrent.TimeUnit

          @Serializable
          data class ClaudeMessage(
              val role: String,
              val content: String
          )

          @Serializable
          data class ClaudeRequest(
              val model: String = "claude-sonnet-5",
              @SerialName("max_tokens")
              val maxTokens: Int = 1024,
              val system: String? = null,
              val messages: List<ClaudeMessage>
          )

          @Serializable
          data class ClaudeContentBlock(
              val type: String,
              val text: String? = null
          )

          @Serializable
          data class ClaudeResponse(
              val content: List<ClaudeContentBlock>
          )

          class AnthropicClient(
              private val apiKey: String =
                  BuildConfig.ANTHROPIC_API_KEY
          ) {

              private val json = Json {
                  ignoreUnknownKeys = true
              }

              private val client =
                  OkHttpClient.Builder()
                      .connectTimeout(
                          30,
                          TimeUnit.SECONDS
                      )
                      .readTimeout(
                          60,
                          TimeUnit.SECONDS
                      )
                      .writeTimeout(
                          60,
                          TimeUnit.SECONDS
                      )
                      .build()

              suspend fun complete(
                  systemPrompt: String,
                  userPrompt: String
              ): String = withContext(Dispatchers.IO) {

                  check(apiKey.isNotBlank()) {
                      "ANTHROPIC_API_KEY is empty."
                  }

                  val requestBody =
                      json.encodeToString(
                          ClaudeRequest.serializer(),
                          ClaudeRequest(
                              system = systemPrompt,
                              messages = listOf(
                                  ClaudeMessage(
                                      role = "user",
                                      content = userPrompt
                                  )
                              )
                          )
                      )

                  val request =
                      Request.Builder()
                          .url(
                              "https://api.anthropic.com/v1/messages"
                          )
                          .addHeader(
                              "x-api-key",
                              apiKey
                          )
                          .addHeader(
                              "anthropic-version",
                              "2023-06-01"
                          )
                          .addHeader(
                              "content-type",
                              "application/json"
                          )
                          .post(
                              requestBody.toRequestBody(
                                  "application/json"
                                      .toMediaType()
                              )
                          )
                          .build()

                  client.newCall(request)
                      .execute()
                      .use { response ->

                          val body =
                              response.body
                                  ?.string()
                                  .orEmpty()

                          if (!response.isSuccessful) {

                              throw IllegalStateException(
                                  "Claude API error ${response.code}: $body"
                              )
                          }

                          val parsed =
                              json.decodeFromString(
                                  ClaudeResponse.serializer(),
                                  body
                              )

                          parsed.content
                              .firstOrNull {
                                  it.type == "text"
                              }
                              ?.text
                              .orEmpty()
                      }
              }
          }
          EOF

          # ========================================================
          # DATABASE
          # ========================================================

          cat > app/src/main/java/com/englishmastery45/app/data/Database.kt <<'EOF'
          package com.englishmastery45.app.data

          import android.content.Context
          import androidx.room.*

          @Entity(tableName = "learner_profile")
          data class LearnerProfile(
              @PrimaryKey
              val id: Int = 1,
              val name: String,
              val overallLevel: String = "",
              val grammarLevel: String = "",
              val vocabularyLevel: String = "",
              val readingLevel: String = "",
              val listeningLevel: String = "",
              val writingLevel: String = "",
              val speakingLevel: String = "",
              val strengths: String = "",
              val weaknesses: String = "",
              val placementCompletedAt: Long = 0L
          )

          @Entity(tableName = "placement_answers")
          data class PlacementAnswer(
              @PrimaryKey(autoGenerate = true)
              val id: Long = 0,
              val skill: String,
              val questionId: String,
              val difficulty: String,
              val userResponse: String,
              val isCorrect: Boolean?,
              val aiScoreJson: String? = null
          )

          @Dao
          interface PlacementDao {

              @Insert(
                  onConflict =
                      OnConflictStrategy.REPLACE
              )
              suspend fun saveProfile(
                  profile: LearnerProfile
              )

              @Query(
                  "SELECT * FROM learner_profile WHERE id = 1 LIMIT 1"
              )
              suspend fun getProfile():
                  LearnerProfile?

              @Insert
              suspend fun insertAnswer(
                  answer: PlacementAnswer
              ): Long

              @Query(
                  "SELECT * FROM placement_answers"
              )
              suspend fun getAllAnswers():
                  List<PlacementAnswer>

              @Query(
                  "DELETE FROM placement_answers"
              )
              suspend fun clearAnswers()
          }

          @Database(
              entities = [
                  LearnerProfile::class,
                  PlacementAnswer::class
              ],
              version = 1,
              exportSchema = false
          )
          abstract class AppDatabase :
              RoomDatabase() {

              abstract fun placementDao():
                  PlacementDao

              companion object {

                  @Volatile
                  private var INSTANCE:
                      AppDatabase? = null

                  fun getInstance(
                      context: Context
                  ): AppDatabase =

                      INSTANCE ?: synchronized(this) {

                          INSTANCE ?: Room.databaseBuilder(
                              context.applicationContext,
                              AppDatabase::class.java,
                              "english_mastery_45.db"
                          )
                          .build()
                          .also {
                              INSTANCE = it
                          }
                      }
              }
          }
          EOF

          # ========================================================
          # QUESTION BANK
          # ========================================================

          cat > app/src/main/java/com/englishmastery45/app/data/QuestionBank.kt <<'EOF'
          package com.englishmastery45.app.data

