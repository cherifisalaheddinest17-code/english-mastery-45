                          "writes"
                      ),
                      1
                  ),

                  McqQuestion(
                      "g_b2_1",
                      CefrLevel.B2,
                      "Hardly ___ the meeting started when the fire alarm rang.",
                      listOf(
                          "had",
                          "did",
                          "has",
                          "was"
                      ),
                      0
                  )
              )

              val vocabulary = listOf(

                  McqQuestion(
                      "v_a1_1",
                      CefrLevel.A1,
                      "I need a reliable car because I ___ a lot.",
                      listOf(
                          "travel",
                          "traveling",
                          "travels",
                          "traveled"
                      ),
                      0
                  ),

                  McqQuestion(
                      "v_a2_1",
                      CefrLevel.A2,
                      "Choose the correct meaning: 'to make a decision'",
                      listOf(
                          "to decide",
                          "to cook",
