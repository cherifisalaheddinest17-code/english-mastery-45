          import com.englishmastery45.app.ui.TestSection
          import com.englishmastery45.app.ui.screens.*
          
          class MainActivity : ComponentActivity() {
          
              private val viewModel: PlacementViewModel by viewModels()
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Surface(Modifier.fillMaxSize()) {
                              AppRoot(viewModel)
                          }
                      }
                  }
              }
          }
          
          private enum class Screen { SPLASH, ONBOARDING, TEST, RESULTS }
          
          @Composable
          private fun AppRoot(viewModel: PlacementViewModel) {
              var screen by remember { mutableStateOf(Screen.SPLASH) }
              val state by viewModel.state.collectAsState()
          
              when (screen) {
                  Screen.SPLASH -> SplashScreen(onFinished = { screen = Screen.ONBOARDING })
          
                  Screen.ONBOARDING -> OnboardingScreen(onContinue = { name ->
                      viewModel.setName(name)
                      screen = Screen.TEST
                  })
          
                  Screen.TEST -> {
                      if (state.section == TestSection.DONE) {
                          screen = Screen.RESULTS
                      } else if (state.isAnalyzing) {
                          AnalyzingScreen()
                      } else {
                          when (state.section) {
                              TestSection.GRAMMAR, TestSection.VOCABULARY, TestSection.READING, TestSection.LISTENING -> {
                                  val question = viewModel.currentQuestion()
                                  if (question != null) {
                                      McqQuestionScreen(
                                          sectionTitle = state.section.name,
                                          question = question,
                                          onAnswer = { index -> viewModel.submitMcqAnswer(question, index) }
                                      )
                                  }
                              }
                              TestSection.WRITING -> {
                                  val prompt = QuestionBank.writingPrompts[state.currentLevel]
                                      ?: QuestionBank.writingPrompts.values.first()
                                  FreeTextScreen(
                                      sectionTitle = "WRITING",
                                      prompt = prompt,
                                      submitLabel = "Submit writing sample",
                                      isAnalyzing = state.isAnalyzing,
                                      error = state.error,
                                      onSubmit = { text -> viewModel.submitAiScoredAnswer(TestSection.WRITING, text) }
                                  )
                              }
                              TestSection.SPEAKING -> {
                                  // MVP: text transcript input stands in for on-device SpeechRecognizer output.
                                  // Wire this to android.speech.SpeechRecognizer in the next iteration.
                                  val prompt = QuestionBank.speakingPrompts[state.currentLevel]
                                      ?: QuestionBank.speakingPrompts.values.first()
                                  FreeTextScreen(
                                      sectionTitle = "SPEAKING (type what you would say for now)",
                                      prompt = prompt,
                                      submitLabel = "Submit speaking sample",
                                      isAnalyzing = state.isAnalyzing,
                                      error = state.error,
                                      onSubmit = { text -> viewModel.submitAiScoredAnswer(TestSection.SPEAKING, text) }
                                  )
                              }
                              else -> {}
                          }
                      }
                  }
          
                  Screen.RESULTS -> ResultsScreen(state = state, onRestart = {
                      screen = Screen.ONBOARDING
                  })
              }
          }
          
