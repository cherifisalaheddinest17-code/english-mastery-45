          package com.englishmastery45.app.data
          
          import com.englishmastery45.app.BuildConfig
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.SerialName
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.json.Json
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import java.util.concurrent.TimeUnit
          
          /**
           * Thin, swappable client for the Claude Messages API.
           * Kept deliberately separate from the rest of the app so the AI provider
           * can be replaced later without touching scoring/UI code.
           */
          @Serializable
          data class ClaudeMessage(val role: String, val content: String)
          
          @Serializable
          data class ClaudeRequest(
              val model: String = "claude-sonnet-5",
              @SerialName("max_tokens") val maxTokens: Int = 1024,
              val system: String? = null,
              val messages: List<ClaudeMessage>
          )
          
          @Serializable
          data class ClaudeContentBlock(val type: String, val text: String? = null)
          
          @Serializable
          data class ClaudeResponse(val content: List<ClaudeContentBlock>)
          
          class AnthropicClient(
              private val apiKey: String = BuildConfig.ANTHROPIC_API_KEY
          ) {
              private val json = Json { ignoreUnknownKeys = true }
          
              private val client = OkHttpClient.Builder()
                  .connectTimeout(30, TimeUnit.SECONDS)
                  .readTimeout(60, TimeUnit.SECONDS)
                  .build()
          
              /**
               * Sends a single-turn prompt to Claude and returns the raw text reply.
               * Throws if the API key is missing/empty or the call fails.
               */
              suspend fun complete(systemPrompt: String, userPrompt: String): String = withContext(Dispatchers.IO) {
                  check(apiKey.isNotBlank()) {
                      "ANTHROPIC_API_KEY is empty. Set it as a GitHub Actions secret before building."
                  }
          
                  val requestBody = json.encodeToString(
                      ClaudeRequest.serializer(),
                      ClaudeRequest(
                          system = systemPrompt,
                          messages = listOf(ClaudeMessage(role = "user", content = userPrompt))
                      )
                  )
          
                  val request = Request.Builder()
                      .url("https://api.anthropic.com/v1/messages")
                      .addHeader("x-api-key", apiKey)
                      .addHeader("anthropic-version", "2023-06-01")
                      .addHeader("content-type", "application/json")
                      .post(requestBody.toRequestBody("application/json".toMediaType()))
                      .build()
          
                  client.newCall(request).execute().use { response ->
                      val bodyString = response.body?.string().orEmpty()
                      if (!response.isSuccessful) {
                          throw IllegalStateException("Claude API error ${response.code}: $bodyString")
                      }
                      val parsed = json.decodeFromString(ClaudeResponse.serializer(), bodyString)
                      return@withContext parsed.content.firstOrNull { it.type == "text" }?.text.orEmpty()
                  }
              }
          }
          
