          cat > app/src/main/java/com/englishmastery45/app/domain/ScoringEngine.kt <<'EOF'
          package com.englishmastery45.app.domain

          import com.englishmastery45.app.data.CefrLevel
          import com.englishmastery45.app.data.PlacementAnswer

          object ScoringEngine {

              fun nextLevel(
                  current: CefrLevel,
                  wasCorrect: Boolean
              ): CefrLevel {

                  val delta =
                      if (wasCorrect) 1 else -1

                  val newOrder =
                      (
                          current.order + delta
                      ).coerceIn(
                          0,
                          CefrLevel.entries.size - 1
                      )

                  return CefrLevel.entries[newOrder]
              }

              fun estimateSkillLevel(
                  answers: List<PlacementAnswer>
              ): CefrLevel {

                  if (answers.isEmpty()) {
                      return CefrLevel.A1
                  }

                  val correctByLevel =
                      answers
                          .filter {
                              it.isCorrect == true
                          }
                          .map {
                              CefrLevel.valueOf(
                                  it.difficulty
                              )
                          }

                  val highest =
                      correctByLevel
                          .maxByOrNull {
                              it.order
                          }
                          ?: CefrLevel.A1

                  val atHighest =
                      answers.filter {
                          CefrLevel.valueOf(
                              it.difficulty
                          ) == highest
                      }

                  val correctAtHighest =
                      atHighest.count {
                          it.isCorrect == true
                      }

                  return if (
                      atHighest.isEmpty() ||
                      correctAtHighest * 2 >=
                      atHighest.size
                  ) {
                      highest
                  } else {
                      CefrLevel.entries[
                          (highest.order - 1)
                              .coerceAtLeast(0)
                      ]
                  }
              }

              fun estimateOverallLevel(
                  skillLevels: List<CefrLevel>
              ): CefrLevel {

                  if (skillLevels.isEmpty()) {
                      return CefrLevel.A1
                  }

                  val avg =
                      skillLevels
                          .map { it.order }
                          .average()

                  return CefrLevel.entries[
                      kotlin.math.round(avg)
                          .toInt()
                          .coerceIn(
                              0,
                              CefrLevel.entries.size - 1
                          )
                  ]
              }

              fun strengthsAndWeaknesses(
                  skillScores:
                      Map<String, CefrLevel>
              ): Pair<List<String>, List<String>> {

                  val average =
                      skillScores.values
                          .map { it.order }
                          .average()

                  val strengths =
                      skillScores
                          .filter {
                              it.value.order > average
                          }
                          .keys
                          .toList()

                  val weaknesses =
                      skillScores
                          .filter {
                              it.value.order < average
                          }
                          .keys
                          .toList()

                  return strengths to weaknesses
              }
          }
