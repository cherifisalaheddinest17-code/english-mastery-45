          data class McqQuestion(
              val id: String,
              val level: CefrLevel,
              val prompt: String,
              val options: List<String>,
              val correctIndex: Int,
              val passage: String? = null
          )

          object QuestionBank {

              val grammar = listOf(

                  McqQuestion(
                      "g_a1_1",
                      CefrLevel.A1,
                      "She ___ a student.",
                      listOf(
                          "is",
                          "are",
