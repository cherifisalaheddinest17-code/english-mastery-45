name: Build English Mastery 45 APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build English Mastery 45
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JDK 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ============================================================
      # 4. GRADLE
      # ============================================================
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ============================================================
      # 5. CREATE PROJECT STRUCTURE
      # ============================================================
      - name: Reconstruct Android project
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/englishmastery45/app/data
          mkdir -p app/src/main/java/com/englishmastery45/app/domain
          mkdir -p app/src/main/java/com/englishmastery45/app/ui/screens
          mkdir -p app/src/main/java/com/englishmastery45/app/ui

          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          # ========================================================
          # SETTINGS.GRADLE.KTS
          # ========================================================

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  org.gradle.api.initialization.resolve.RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "EnglishMastery45"

          include(":app")
          EOF

          # ========================================================
          # ROOT BUILD.GRADLE.KTS
          # ========================================================

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "1.9.24" apply false
              id("com.google.devtools.ksp") version "1.9.24-1.0.20" apply false
          }
          EOF

          # ========================================================
          # GRADLE.PROPERTIES
          # ========================================================

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # ========================================================
          # APP BUILD.GRADLE.KTS
          # ========================================================

          cat > app/build.gradle.kts <<'EOF'
          import java.util.Properties

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.serialization")
              id("com.google.devtools.ksp")
          }

          val anthropicApiKey =
              System.getenv("ANTHROPIC_API_KEY") ?: ""

          android {
              namespace = "com.englishmastery45.app"

              compileSdk = 34

              defaultConfig {
                  applicationId = "com.englishmastery45.app"

                  minSdk = 26
                  targetSdk = 34

                  versionCode = 1
                  versionName = "1.0"

                  buildConfigField(
                      "String",
                      "ANTHROPIC_API_KEY",
                      "\"$anthropicApiKey\""
                  )
              }

              buildTypes {

                  release {
                      isMinifyEnabled = false

                      proguardFiles(
                          getDefaultProguardFile(
                              "proguard-android-optimize.txt"
                          ),
                          "proguard-rules.pro"
                      )
                  }

                  debug {
                      isMinifyEnabled = false
                  }
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {

              implementation("androidx.core:core-ktx:1.13.1")

              implementation(
                  "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
              )

              implementation(
                  "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4"
              )

              implementation(
                  "androidx.activity:activity-compose:1.9.1"
              )

              implementation(
                  platform(
                      "androidx.compose:compose-bom:2024.06.00"
                  )
              )

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation(
                  "androidx.compose.ui:ui-tooling-preview"
              )

              implementation(
                  "androidx.compose.material3:material3"
              )

              implementation(
                  "androidx.navigation:navigation-compose:2.7.7"
              )

              implementation(
                  "androidx.room:room-runtime:2.6.1"
              )

              implementation(
                  "androidx.room:room-ktx:2.6.1"
              )

              ksp(
                  "androidx.room:room-compiler:2.6.1"
              )

              implementation(
                  "com.squareup.retrofit2:retrofit:2.11.0"
              )

              implementation(
                  "com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0"
              )

              implementation(
                  "com.squareup.okhttp3:okhttp:4.12.0"
              )

              implementation(
                  "com.squareup.okhttp3:logging-interceptor:4.12.0"
              )

              implementation(
                  "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
              )

              implementation(
                  "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
              )

              debugImplementation(
                  "androidx.compose.ui:ui-tooling"
              )
          }
          EOF

          # ========================================================
          # PROGUARD
          # ========================================================

          cat > app/proguard-rules.pro <<'EOF'
          # English Mastery 45
          EOF

